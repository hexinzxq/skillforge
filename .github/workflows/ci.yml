name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      # Covers skills/ strictly and vendor/**/SKILL.md in relaxed mode, so a
      # vendored copy that no longer loads can't slip in unnoticed either.
      - name: Validate every skill against the spec
        run: python3 tools/validate_skills.py

      - name: Unit tests (validator, parsers)
        run: python3 -m unittest discover -s tests -t . -v

      # Symlink install, removal, then a copy install: the three ways someone
      # actually installs this, and the copy one is what silently breaks when a
      # skill directory is renamed.
      - name: Installer end to end
        run: |
          bash install.sh --dry-run --target /tmp/skills-target
          bash install.sh --target /tmp/skills-target
          test -L /tmp/skills-target/frontend-design
          bash install.sh --remove --target /tmp/skills-target
          test ! -e /tmp/skills-target/frontend-design
          bash install.sh --target /tmp/skills-target --copy
          test -f /tmp/skills-target/frontend-design/SKILL.md
