name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Validate every skill against the spec
        run: python3 tools/validate_skills.py

      - name: Unit tests (validator, parsers)
        run: python3 -m unittest discover -s tests -t . -v

      - name: Token generator produces passing contrast on a sample brand
        run: |
          python3 skills/design-tokens/scripts/gen_tokens.py --brand "#3b82f6" --out /tmp/tokens
          test -s /tmp/tokens/tokens.css
          test -s /tmp/tokens/tokens.json

      - name: Installer dry-run
        run: |
          bash install.sh --dry-run --target /tmp/skills-target
          bash install.sh --target /tmp/skills-target --copy
          test -f /tmp/skills-target/ui-critique/SKILL.md
          bash install.sh --remove --target /tmp/skills-target >/dev/null || true
