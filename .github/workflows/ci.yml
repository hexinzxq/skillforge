name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      # Covers skills/ strictly and vendor/**/SKILL.md in relaxed mode, so a
      # vendored copy that no longer loads can't slip in unnoticed either.
      - name: Validate every skill against the spec
        run: python3 tools/validate_skills.py

      - name: Unit tests (validator, parsers)
        run: python3 -m unittest discover -s tests -t . -v

      # The contrast checker is what the skill tells the model to run, so CI runs
      # it too: a token sheet that fails 4.5:1 must never look shippable.
      - name: Contrast checker gates a sample token sheet
        run: |
          python3 skills/frontend-design/scripts/contrast.py --css tests/fixtures/tokens-good.css
          ! python3 skills/frontend-design/scripts/contrast.py --css tests/fixtures/tokens-bad.css

      # Same contract for the output linter: the clean fixture must pass and the
      # sloppy one must fail, so a broken rule can't quietly stop catching things.
      - name: Slop linter gates a sample page
        run: |
          python3 skills/frontend-design/scripts/sloplint.py tests/fixtures/slop-good.html
          ! python3 skills/frontend-design/scripts/sloplint.py tests/fixtures/slop-bad.html

      # Symlink install, removal, then a copy install: the three ways someone
      # actually installs this, and the copy one is what silently breaks when a
      # skill directory is renamed.
      - name: Installer end to end
        run: |
          bash install.sh --dry-run --target /tmp/skills-target
          bash install.sh --target /tmp/skills-target
          test -L /tmp/skills-target/frontend-design
          bash install.sh --remove --target /tmp/skills-target
          test ! -e /tmp/skills-target/frontend-design
          bash install.sh --target /tmp/skills-target --copy
          test -f /tmp/skills-target/frontend-design/SKILL.md
      # Vendored skills live at mixed depths; if discovery only globs one level
      # they silently vanish from --list and from the install.
      - name: Installer vendor path
        run: |
          ./install.sh --list | grep -q "^  frontend-design"
          ./install.sh --list | grep -q "^  common-accessibility"
          bash install.sh --vendor --only common-accessibility --target /tmp/skills-vendor
          test -L /tmp/skills-vendor/common-accessibility
          test -f /tmp/skills-vendor/common-accessibility/SKILL.md
          test "$(find /tmp/skills-vendor -maxdepth 1 -mindepth 1 | wc -l)" -eq 1
